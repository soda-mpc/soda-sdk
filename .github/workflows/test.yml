name: Test

on:
  push:
    branches: [ "master", "testnet" ]
  pull_request:
    branches: [ "master", "testnet" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: 1.20.7 
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.8
    
      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Set up Node.js
        working-directory: ./js
        run: npm install  

      - name: JavaScript tests
        working-directory: ./js
        run: |
          npx mocha --fgrep "should decrypt a message using RSA scheme" --invert test.mjs

      - name: TypeScript tests
        working-directory: ./ts
        run: |
          npx jest --testNamePattern="^(?!.*should decrypt a message using RSA scheme).*$"

      - name: Python tests
        working-directory: ./python/soda_python_sdk
        run: |
          python3 -m unittest -v test.py -k "TestMpcHelper"

      - name: Go tests
        working-directory: ./golang_cli
        run: |
          go mod download
          go test -v -count=1 ./...


      # During the Go tests, an encryption is saved to a file. 
      # Subsequently, this encryption needs to be decrypted and verified in both the JavaScript and Python tests. 
      # As part of this process, the JavaScript and Python decrypt tests are executed after the Go tests to ensure that the encryption is correctly decrypted.
      - name: JavaScript decrypt test
        working-directory: ./js
        run: |
          npx mocha --grep "should decrypt a message using RSA scheme" test.mjs

      - name: TypeScript decrypt test
        working-directory: ./ts
        run: |
          npx jest -t "should decrypt a message using RSA scheme"

      - name: Python decrypt test
        working-directory: ./python/soda_python_sdk
        run: |
          # Run the RSA encryption test first to create the required file
          python3 -m unittest -v test.py -k "test_rsa_encryption"
          # Then run the decryption test
          python3 -m unittest -v test.py -k "test_rsa_decryption"

      - name: Check Exit Codes
        run: |
          if [ ${{ job.status }} == "success" ]; then
            echo "All processes exited with exit code 0."
          else
            echo "One or more processes did not exit with exit code 0."
          fi
          

