name: Publish Python Package to PyPI

on:
  workflow_dispatch:  # Manual triggering only
    inputs:
      channel:
        description: 'PyPI channel to publish to'
        required: true
        default: 'testpypi'
        type: choice
        options:
          - testpypi
          - pypi

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write  # Required for OIDC
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build twine wheel
          pip install -r requirements.txt

      - name: Run Python tests
        run: |
          cd python/soda_python_sdk
          python -m unittest test.py -v -k "TestMpcHelper"

      - name: Handle versioning
        id: versioning
        run: |
          CHANNEL="${{ github.event.inputs.channel }}"
          
          # Get current version from setup.py (managed manually)
          CURRENT_VERSION=$(python -c "import re; print(re.search(r'version=[\'\"]([^\'\"]*)[\'\"]', open('setup.py').read()).group(1))")
          echo "Current version (from setup.py): $CURRENT_VERSION"
          NEW_VERSION="$CURRENT_VERSION"
          
          echo "version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "channel=$CHANNEL" >> $GITHUB_OUTPUT
          echo "Publishing version $NEW_VERSION to $CHANNEL"

      - name: Clean build artifacts
        run: |
          rm -rf dist/ build/ python/soda_sdk.egg-info/

      - name: Build package
        run: |
          python -m build
          ls -la dist/

      - name: Verify package
        run: |
          python -m twine check dist/*

      - name: Configure Git
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"

      - name: Publish to TestPyPI (trusted publisher)
        if: ${{ steps.versioning.outputs.channel == 'testpypi' }}
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: dist

      - name: Publish to PyPI (trusted publisher)
        if: ${{ steps.versioning.outputs.channel == 'pypi' }}
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist

      - name: Create GitHub Release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: python-v${{ steps.versioning.outputs.version }}
          release_name: Python SDK Release ${{ steps.versioning.outputs.version }} (${{ steps.versioning.outputs.channel }})
          body: |
            ## Python SDK Release ${{ steps.versioning.outputs.version }}
            
            - Updated Python SDK to version ${{ steps.versioning.outputs.version }}
            - Published to PyPI ${{ steps.versioning.outputs.channel }}
            - All tests passing ✅
            
            ## Installation
            
            ```bash
            # From PyPI
            pip install soda-sdk
            
            # From TestPyPI
            pip install --index-url https://test.pypi.org/simple/ soda-sdk
            ```
            
            ## Features
            
            - AES encryption/decryption
            - RSA key generation and encryption
            - ECDSA signature generation
            - Blockchain integration utilities
            - 256-bit number support
          draft: false
          prerelease: ${{ steps.versioning.outputs.channel == 'testpypi' }}
