name: Publish to npm

on:
  workflow_dispatch:  # Manual triggering only
    inputs:
      channel:
        description: 'npm channel to publish to'
        required: true
        default: 'test'
        type: choice
        options:
          - test
          - beta
          - alpha
          - latest

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}  # ensure secret is available to all steps
    permissions:
      contents: write
      packages: write
      id-token: write  # Required for OIDC
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Fetch full history for proper versioning

      - name: Setup Node.js
        uses: actions/setup-node@v4
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        with:
          node-version: '18'
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'
          always-auth: true  # force npm to use auth for all requests

      - name: Configure npm auth
        # NPM_TOKEN must be an "automation" token so publish does not require OTP.
        run: |
          if [ -z "$NPM_TOKEN" ]; then
            echo "NPM token is not configured" >&2
            exit 1
          fi
          echo "::add-mask::$NPM_TOKEN"
          npm config set //registry.npmjs.org/:_authToken "$NPM_TOKEN"
          echo "Token length: ${#NPM_TOKEN}"
          npm whoami

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: |
          npm run test:ts
          npm run test:js

      - name: Build TypeScript
        run: npm run build

      - name: Verify build
        run: |
          ls -la dist/
          node -e "console.log('Build verification:', require('./dist/index.js'))"

      - name: Configure Git
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"

      - name: Handle versioning
        id: versioning
        run: |
          CHANNEL="${{ github.event.inputs.channel }}"
          NEW_VERSION=$(node -p "require('./package.json').version")
          
          echo "version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "channel=$CHANNEL" >> $GITHUB_OUTPUT
          echo "Publishing version $NEW_VERSION to $CHANNEL channel"

      - name: Configure npm for publishing
        run: |
          # Configure npm registry
          npm config set registry https://registry.npmjs.org/
          echo "Publishing to channel: ${{ steps.versioning.outputs.channel }}"

      - name: Publish to npm (using npm token)
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          npm publish --tag ${{ steps.versioning.outputs.channel }}
          echo "✅ Successfully published to npm ${{ steps.versioning.outputs.channel }} channel!"

      - name: Create GitHub Release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v${{ steps.versioning.outputs.version }}
          release_name: Release ${{ steps.versioning.outputs.version }} (${{ steps.versioning.outputs.channel }})
          body: |
            ## Changes in this Release
            
            - Updated SDK to version ${{ steps.versioning.outputs.version }}
            - Published to npm ${{ steps.versioning.outputs.channel }} channel
            - All tests passing ✅
            
            ## Installation
            
            ```bash
            npm install soda-bubble-sdk@${{ steps.versioning.outputs.channel }}
            ```
          draft: false
          prerelease: ${{ contains(steps.versioning.outputs.channel, 'beta') || contains(steps.versioning.outputs.channel, 'alpha') || contains(steps.versioning.outputs.channel, 'test') }}
