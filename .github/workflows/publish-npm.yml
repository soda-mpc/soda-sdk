name: Publish to npm

on:
  workflow_dispatch:  # Manual triggering only
    inputs:
      version:
        description: 'Version to publish (e.g., 0.1.0, patch, minor, major)'
        required: true
        default: 'patch'
      channel:
        description: 'npm channel to publish to'
        required: true
        default: 'test'
        type: choice
        options:
          - test
          - beta
          - alpha
          - latest

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write  # Required for OIDC
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Fetch full history for proper versioning

      - name: Setup Node.js
        uses: actions/setup-node@v4
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        with:
          node-version: '18'
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build TypeScript
        run: npm run build

      - name: Verify build
        run: |
          ls -la dist/
          node -e "console.log('Build verification:', require('./dist/index.js'))"

      - name: Configure Git
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"

      - name: Handle versioning
        id: versioning
        run: |
          VERSION_INPUT="${{ github.event.inputs.version }}"
          CHANNEL="${{ github.event.inputs.channel }}"
          
          if [ "$VERSION_INPUT" = "patch" ] || [ "$VERSION_INPUT" = "minor" ] || [ "$VERSION_INPUT" = "major" ]; then
            # Use npm version to bump
            npm version $VERSION_INPUT --no-git-tag-version
            NEW_VERSION=$(node -p "require('./package.json').version")
          else
            # Use specific version
            npm version $VERSION_INPUT --no-git-tag-version
            NEW_VERSION=$VERSION_INPUT
          fi
          
          echo "version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "channel=$CHANNEL" >> $GITHUB_OUTPUT
          echo "Publishing version $NEW_VERSION to $CHANNEL channel"

      - name: Configure npm for publishing
        run: |
          # Configure npm registry
          npm config set registry https://registry.npmjs.org/
          echo "Publishing to channel: ${{ steps.versioning.outputs.channel }}"

      - name: Publish to npm (using npm token)
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          npm publish --tag ${{ steps.versioning.outputs.channel }}
          echo "✅ Successfully published to npm ${{ steps.versioning.outputs.channel }} channel!"

      - name: Create GitHub Release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v${{ steps.versioning.outputs.version }}
          release_name: Release ${{ steps.versioning.outputs.version }} (${{ steps.versioning.outputs.channel }})
          body: |
            ## Changes in this Release
            
            - Updated SDK to version ${{ steps.versioning.outputs.version }}
            - Published to npm ${{ steps.versioning.outputs.channel }} channel
            - All tests passing ✅
            
            ## Installation
            
            ```bash
            npm install soda-bubble-sdk@${{ steps.versioning.outputs.channel }}
            ```
          draft: false
          prerelease: ${{ contains(steps.versioning.outputs.channel, 'beta') || contains(steps.versioning.outputs.channel, 'alpha') || contains(steps.versioning.outputs.channel, 'test') }}

